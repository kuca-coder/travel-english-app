<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>旅する英会話</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif; background:#f5f7fa; color:#263238; margin:0; padding:22px 14px 40px; }
    main { max-width:520px; margin:0 auto; }
    h1 { font-size:27px; margin:8px 0; text-align:center; }
    .intro { text-align:center; margin:0 0 22px; color:#52656d; }
    .panel { background:white; border-radius:18px; padding:20px 17px; margin:14px 0; box-shadow:0 4px 16px #0000000d; }
    h2 { font-size:19px; margin:0 0 12px; }
    .category-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    button { font:inherit; border:0; border-radius:12px; padding:14px 12px; cursor:pointer; background:#176b87; color:white; min-height:48px; }
    button.secondary { background:#e6eef2; color:#263238; }
    button.category { min-height:84px; font-weight:600; line-height:1.45; }
    button.category small { display:block; font-size:12px; font-weight:400; margin-top:5px; }
    button.category.selected { outline:3px solid #80bdcf; outline-offset:1px; }
    .mode-row { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .mode-row button { font-size:15px; }
    .mode-row button.selected { background:#124d62; outline:3px solid #a5d5e1; }
    .label { color:#607d8b; font-size:13px; margin:12px 0 5px; }
    #japanese { font-size:22px; line-height:1.55; white-space:pre-line; }
    #english { font-size:27px; font-weight:700; line-height:1.45; overflow-wrap:anywhere; margin:12px 0 20px; }
    #status { background:#edf4f7; padding:13px 10px; border-radius:12px; margin:16px 0; font-size:15px; line-height:1.6; min-height:48px; }
    .actions { display:grid; gap:8px; }
    .nav { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    #progress { color:#607d8b; text-align:center; margin-top:15px; font-size:14px; }
    .note { font-size:13px; line-height:1.6; color:#607d8b; }
    @media (max-width:360px) { #english { font-size:23px; } .panel { padding:17px 13px; } }
  
    #english { white-space: pre-line; }
  </style>
</head>
<body>
<main>
  <h1>✈️ 旅する英会話</h1>
  <p class="intro">聞いて、まねして、話してみよう！</p>

  <section class="panel">
    <h2>① 練習する場面を選ぶ</h2>
    <div class="category-grid" id="categoryButtons">
      <button class="category selected" data-category="airport">✈️ 空港・飛行機<small>チェックイン・機内など</small></button>
      <button class="category" data-category="town">🗺️ 街で使う英語<small>買い物・食事・観光</small></button>
      <button class="category" data-category="chat">💬 雑談・自己紹介<small>挨拶・簡単な会話</small></button>
      <button class="category" data-category="help">🆘 困ったとき<small>聞き返し・体調など</small></button>
      <button class="category" data-category="home">🏠 おうちでのおもてなし<small>来客・食事・日常会話</small></button>
    </div>
  </section>

  <section class="panel">
    <h2>② 練習方法を選ぶ</h2>
    <div class="mode-row">
      <button id="phraseMode" class="selected">📣 フレーズ</button>
      <button id="wordMode" class="secondary">📖 単語</button>
      <button id="conversationMode" class="secondary">💬 会話</button>
      <button id="listenMode" class="secondary">🎧 通し聞き</button>
    </div>
    <p class="note" id="modeDescription">日本語 → 英語 → 4秒の発話時間 → 英語 → 4秒の発話時間、の順に練習します。</p>
    <label id="pauseLabel" class="note"><input type="checkbox" id="shadowPause" checked> 通し聞きでも英語のあとに4秒の発話時間を入れる</label>
  </section>

  <section class="panel">
    <p class="label" id="categoryLabel">空港・飛行機</p>
    <p class="label">日本語の意味</p>
    <div id="japanese">チェックインをしたいです。</div>
    <p class="label">英語のお手本</p>
    <div id="english">I'd like to check in.</div>
    <div class="actions">
      <button id="startButton">▶ このセクションを練習</button>
      <button id="stopButton" class="secondary">■ 停止</button>
      <button id="replayButton" class="secondary">🔊 英語をもう一度聞く</button>
      <div class="nav"><button id="prevButton" class="secondary">← 前へ</button><button id="nextButton" class="secondary">次へ →</button></div>
    </div>
    <div id="status" aria-live="polite">カテゴリと練習方法を選んで、スタートしましょう。</div>
    <div id="progress">1 / 10</div>
  </section>
  <p class="note">音声はブラウザの読み上げ機能（speechSynthesis）を使います。MP3ファイルは必要ありません。iPhoneでは、最初にスタートボタンを押して音声が出ることを確認してください。</p>
</main>

const categoryNames = {airport:"空港・飛行機", town:"街で使う英語", chat:"雑談・自己紹介", help:"困ったとき", home:"おうちでのおもてなし"};
const categoryOrder = ["airport", "town", "chat", "help", "home"];
const PRACTICE_TIME = 4000;
const WORD_TIME = 2000;
const RESPONSE_TIME = 3000;
const BETWEEN_LANGUAGE_TIME = 500;
const $ = id => document.getElementById(id);

let category = "airport";
let mode = "phrase"; // phrase / word / conversation / listen
let current = 0;
let isPlaying = false;
let runId = 0;
let practiceTimer = null;
let allMode = false;
let allCategoryIndex = 0;
let allListenType = "phrases";

function currentList() {
  if (mode === "word") return lessons[category].words || [];
  if (mode === "conversation") return lessons[category].conversations || [];
  return lessons[category].phrases || [];
}
function stopAudio() {
  clearTimeout(practiceTimer);
  if (window.speechSynthesis) speechSynthesis.cancel();
}
function speak(text, language, onEnd) {
  if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) {
    $("status").textContent = "このブラウザでは音声読み上げを利用できません。";
    isPlaying = false;
    return;
  }
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = language;
  utterance.rate = 0.82;
  utterance.onend = () => { if (onEnd) onEnd(); };
  utterance.onerror = () => {
    if (isPlaying) {
      isPlaying = false;
      $("status").textContent = "音声を再生できませんでした。もう一度スタートしてください。";
    }
  };
  speechSynthesis.speak(utterance);
}
function updateScreen() {
  const list = currentList();
  current = Math.max(0, Math.min(current, Math.max(0, list.length - 1)));
  const item = list[current];
  if (!item) return;
  if (mode === "conversation") {
    $("japanese").textContent = `質問：${item.questionJa}\n回答例：${item.answerJa}`;
    $("english").textContent = `Q：${item.question}\nA：${item.answer}`;
  } else {
    $("japanese").textContent = item.ja;
    $("english").textContent = item.en;
  }
  $("categoryLabel").textContent = `${categoryNames[category]}｜${modeNames[mode]}`;
  $("progress").textContent = `${current + 1} / ${list.length}　｜　${categoryNames[category]}`;
}
function stopPractice(showMessage = true) {
  isPlaying = false;
  allMode = false;
  runId++;
  stopAudio();
  if (showMessage) $("status").textContent = "停止しました。再開するにはスタートを押してください。";
}
function startPractice() {
  if (mode === "listen") { startAllListening(); return; }
  stopPractice(false);
  current = 0;
  isPlaying = true;
  const id = ++runId;
  updateScreen();
  if (mode === "word") playWord(id);
  else if (mode === "conversation") playConversation(id);
  else playPhrase(id);
}
function finishSection(message = "🎉 このセクションは終了です！") {
  isPlaying = false;
  $("status").textContent = message;
}
function playPhrase(id) {
  if (!isPlaying || id !== runId) return;
  const list = currentList();
  if (current >= list.length) return finishSection();
  const item = list[current];
  updateScreen();
  $("status").textContent = "① 日本語を聞いています…";
  speak(item.ja, "ja-JP", () => {
    if (!isPlaying || id !== runId) return;
    practiceTimer = setTimeout(() => {
      if (!isPlaying || id !== runId) return;
      $("status").textContent = "② 英語のお手本を聞いています…";
      speak(item.en, "en-US", () => {
        if (!isPlaying || id !== runId) return;
        $("status").textContent = "③ 自分で言ってみよう！（4秒）";
        practiceTimer = setTimeout(() => {
          if (!isPlaying || id !== runId) return;
          $("status").textContent = "④ もう一度、英語のお手本を聞いています…";
          speak(item.en, "en-US", () => {
            if (!isPlaying || id !== runId) return;
            $("status").textContent = "⑤ もう一度、自分で言ってみよう！（4秒）";
            practiceTimer = setTimeout(() => {
              if (!isPlaying || id !== runId) return;
              current++;
              playPhrase(id);
            }, PRACTICE_TIME);
          });
        }, PRACTICE_TIME);
      });
    }, BETWEEN_LANGUAGE_TIME);
  });
}
function playWord(id) {
  if (!isPlaying || id !== runId) return;
  const list = currentList();
  if (current >= list.length) return finishSection("🎉 単語練習は終了です！");
  const item = list[current];
  updateScreen();
  $("status").textContent = "① 日本語を聞いています…";
  speak(item.ja, "ja-JP", () => {
    if (!isPlaying || id !== runId) return;
    practiceTimer = setTimeout(() => {
      if (!isPlaying || id !== runId) return;
      $("status").textContent = "② 英語のお手本を聞いています…";
      speak(item.en, "en-US", () => {
        if (!isPlaying || id !== runId) return;
        $("status").textContent = "③ 英語を言ってみましょう！（2秒）";
        practiceTimer = setTimeout(() => {
          if (!isPlaying || id !== runId) return;
          current++;
          playWord(id);
        }, WORD_TIME);
      });
    }, BETWEEN_LANGUAGE_TIME);
  });
}
function playConversation(id) {
  if (!isPlaying || id !== runId) return;
  const list = currentList();
  if (current >= list.length) return finishSection("🎉 会話練習は終了です！");
  const item = list[current];
  updateScreen();

  // 場面の説明を聞く
  $("status").textContent = `場面：${item.scene}`;
  speak(item.scene, "ja-JP", () => {
    if (!isPlaying || id !== runId) return;

    // 場面の説明と質問の日本語の間を0.5秒あける
    practiceTimer = setTimeout(() => {
      if (!isPlaying || id !== runId) return;

      $("status").textContent = "① 質問の日本語を聞いています…";
      speak(item.questionJa, "ja-JP", () => {
        if (!isPlaying || id !== runId) return;

        $("status").textContent = "② 英語で質問してみましょう！（3秒）";
        practiceTimer = setTimeout(() => {
          if (!isPlaying || id !== runId) return;

          $("status").textContent = "③ 英語の質問のお手本を聞いています…";
          speak(item.question, "en-US", () => {
            if (!isPlaying || id !== runId) return;

            // 英語の質問と回答例の日本語の間を0.5秒あける
            practiceTimer = setTimeout(() => {
              if (!isPlaying || id !== runId) return;

              $("status").textContent = "④ 回答例の日本語を聞いています…";
              speak(item.answerJa, "ja-JP", () => {
                if (!isPlaying || id !== runId) return;

                $("status").textContent = "⑤ 英語で答えてみましょう！（3秒）";
                practiceTimer = setTimeout(() => {
                  if (!isPlaying || id !== runId) return;

                  $("status").textContent = "⑥ 英語の回答のお手本を聞いています…";
                  speak(item.answer, "en-US", () => {
                    if (!isPlaying || id !== runId) return;

                    // 次の会話に移る前に0.5秒あける
                    practiceTimer = setTimeout(() => {
                      if (!isPlaying || id !== runId) return;
                      current++;
                      playConversation(id);
                    }, BETWEEN_LANGUAGE_TIME);
                  });
                }, RESPONSE_TIME);
              });
            }, BETWEEN_LANGUAGE_TIME);
          });
        }, RESPONSE_TIME);
      });
    }, BETWEEN_LANGUAGE_TIME);
  });
}
function startAllListening() {
  stopPractice(false);
  mode = "listen";
  setModeButtons();
  allMode = true;
  isPlaying = true;
  allCategoryIndex = 0;
  allListenType = "phrases";
  current = 0;
  const id = ++runId;
  playAllItem(id);
}
function playAllItem(id) {
  if (!isPlaying || id !== runId || !allMode) return;

  if (allCategoryIndex >= categoryOrder.length) {
    isPlaying = false;
    allMode = false;
    $("status").textContent = "🎉 5セクションのフレーズ・単語をすべて再生しました！お疲れさまでした。";
    $("progress").textContent = "全5セクション終了";
    return;
  }

  category = categoryOrder[allCategoryIndex];
  const section = lessons[category];
  const list = allListenType === "phrases" ? (section.phrases || []) : (section.words || []);

  // そのカテゴリーのフレーズが終わったら、同じカテゴリーの単語へ進む。
  // 単語も終わったら次のカテゴリーへ進む。
  if (current >= list.length) {
    if (allListenType === "phrases") {
      allListenType = "words";
      current = 0;
      playAllItem(id);
      return;
    }
    allCategoryIndex++;
    allListenType = "phrases";
    current = 0;
    playAllItem(id);
    return;
  }

  const item = list[current];
  document.querySelectorAll("[data-category]").forEach(button => {
    button.classList.toggle("selected", button.dataset.category === category);
  });

  $("japanese").textContent = item.ja;
  $("english").textContent = item.en;
  $("categoryLabel").textContent =
    `${categoryNames[category]}｜${allListenType === "phrases" ? "フレーズ" : "単語"}（通し聞き）`;
  $("progress").textContent =
    `${current + 1} / ${list.length}　｜　${categoryNames[category]}｜${allListenType === "phrases" ? "フレーズ" : "単語"}`;

  $("status").textContent =
    `通し聞き中：${categoryNames[category]}の${allListenType === "phrases" ? "フレーズ" : "単語"}（日本語）`;

  speak(item.ja, "ja-JP", () => {
    if (!isPlaying || id !== runId) return;

    practiceTimer = setTimeout(() => {
      if (!isPlaying || id !== runId) return;

      $("status").textContent =
        `通し聞き中：${categoryNames[category]}の${allListenType === "phrases" ? "フレーズ" : "単語"}（英語）`;

      speak(item.en, "en-US", () => {
        if (!isPlaying || id !== runId) return;

        // フレーズは4秒、単語は2秒の発話時間。チェックを外すと短い間隔で次へ。
        const defaultWait = allListenType === "phrases" ? PRACTICE_TIME : WORD_TIME;
        const wait = $("shadowPause").checked ? defaultWait : 350;
        $("status").textContent = $("shadowPause").checked
          ? `英語を言ってみましょう！（${defaultWait / 1000}秒）`
          : "次へ…";

        practiceTimer = setTimeout(() => {
          if (!isPlaying || id !== runId) return;
          current++;
          playAllItem(id);
        }, wait);
      });
    }, BETWEEN_LANGUAGE_TIME);
  });
}
function replayEnglish() {
  stopPractice(false);
  const item = currentList()[current];
  if (!item) return;
  $("status").textContent = "英語を聞いてみましょう。";
  if (mode === "conversation") {
    speak(item.question, "en-US", () => speak(item.answer, "en-US"));
  } else {
    speak(item.en, "en-US");
  }
}
function move(direction) {
  stopPractice(false);
  const list = currentList();
  if (!list.length) return;
  current = (current + direction + list.length) % list.length;
  updateScreen();
  $("status").textContent = "準備できました。スタートを押して練習しましょう！";
}
const modeNames = {phrase:"フレーズ練習", word:"単語練習", conversation:"会話練習", listen:"通し聞き"};
function setModeButtons() {
  const ids = {phrase:"phraseMode", word:"wordMode", conversation:"conversationMode", listen:"listenMode"};
  Object.entries(ids).forEach(([key, id]) => {
    $(id).classList.toggle("selected", mode === key);
    $(id).classList.toggle("secondary", mode !== key);
  });
  const descriptions = {
    phrase:"日本語 → 英語 → 4秒の発話時間 → 英語 → 4秒の発話時間、の順に練習します。",
    word:"日本語 → 英語 → 2秒の発話時間、の順に単語を練習します。",
    conversation:"場面と質問の意味を聞いたあと、英語の質問に3秒で答え、回答例を聞いて3秒まねします。",
    listen:"スタートすると各セクションのフレーズと単語を順番に再生し、5セクションすべてを通して練習できます。発話時間の有無を選べます。"
  };
  $("modeDescription").textContent = descriptions[mode];
  $("startButton").textContent = mode === "listen" ? "▶ 5セクションを通しで再生" : `▶ ${modeNames[mode]}を開始`;
}
document.querySelectorAll("[data-category]").forEach(button => button.addEventListener("click", () => {
  stopPractice(false);
  category = button.dataset.category;
  current = 0;
  document.querySelectorAll("[data-category]").forEach(b => b.classList.toggle("selected", b === button));
  updateScreen();
  $("status").textContent = `${categoryNames[category]}を選びました。練習を始めましょう！`;
}));
$("phraseMode").addEventListener("click", () => { stopPractice(false); mode = "phrase"; current = 0; setModeButtons(); updateScreen(); });
$("wordMode").addEventListener("click", () => { stopPractice(false); mode = "word"; current = 0; setModeButtons(); updateScreen(); });
$("conversationMode").addEventListener("click", () => { stopPractice(false); mode = "conversation"; current = 0; setModeButtons(); updateScreen(); });
$("listenMode").addEventListener("click", () => { stopPractice(false); mode = "listen"; current = 0; setModeButtons(); updateScreen(); });
$("startButton").addEventListener("click", startPractice);
$("stopButton").addEventListener("click", () => stopPractice(true));
$("replayButton").addEventListener("click", replayEnglish);
$("prevButton").addEventListener("click", () => move(-1));
$("nextButton").addEventListener("click", () => move(1));
setModeButtons();
updateScreen();
</script>
</body>
</html>
